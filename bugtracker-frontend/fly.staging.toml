# fly.toml app configuration file generated for sainagendra-bugtracker-web-staging on 2026-10-21T21:36:06+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sainagendra-bugtracker-web-staging'
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[build.args]
  NEXT_PUBLIC_API_URL = "https://sainagendra-bugtracker-api-staging.fly.dev"