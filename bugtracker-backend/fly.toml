# fly.toml app configuration file generated for sainagendra-bugtracker-api on 2026-10-21T21:43:29+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sainagendra-bugtracker-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'bugtracker_data'
  destination = '/app/data'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
